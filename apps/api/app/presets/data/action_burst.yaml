id: action_burst
label: "Action Burst"
category: camera-motion
capability: text_to_video
credit_cost: 16
target:
  primary:
    provider: byteplus            # native Seedance, free credits
    model: ""                     # empty -> uses BYTEPLUS_VIDEO_MODEL
  fallback:
    provider: openrouter_video    # empty -> uses OPENROUTER_VIDEO_MODEL
    model: ""
defaults:
  duration_s: 5
  aspect_ratio: "9:16"
  resolution: "720p"
params:
  camera_motion: "handheld_tracking"
  camerafixed: false
prompt_suffix: ", high-energy action, fast handheld tracking, motion blur, dynamic camera, dramatic lighting"
allow_override:
  - duration_s
  - aspect_ratio
