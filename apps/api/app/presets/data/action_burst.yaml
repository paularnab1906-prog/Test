id: action_burst
label: "Action Burst"
category: camera-motion
capability: text_to_video
credit_cost: 16
target:
  primary:
    provider: fal
    model: "fal-ai/kling-video/v1.6/pro/text-to-video"
  fallback:
    provider: replicate
    model: "minimax/video-01"
defaults:
  duration_s: 5
  aspect_ratio: "9:16"
params:
  camera_motion: "handheld_tracking"
prompt_suffix: ", high-energy action, fast handheld tracking, motion blur, dynamic camera, dramatic lighting"
allow_override:
  - duration_s
  - aspect_ratio
