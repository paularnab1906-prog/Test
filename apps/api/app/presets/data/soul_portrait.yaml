id: soul_portrait
label: "Soul Portrait"
category: image
capability: text_to_image
credit_cost: 4
target:
  primary:
    provider: openrouter
    model: "google/gemini-2.5-flash-image-preview"
  fallback:
    provider: fal
    model: "fal-ai/flux/dev"
defaults:
  aspect_ratio: "3:4"
  num_images: 1
prompt_suffix: ", photoreal portrait, soft studio lighting, 85mm, skin detail, editorial"
allow_override:
  - aspect_ratio
  - num_images
