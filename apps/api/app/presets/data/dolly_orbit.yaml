id: dolly_orbit
label: "Dolly Orbit"
category: camera-motion
capability: image_to_video
credit_cost: 14
target:
  primary:
    provider: byteplus            # native Seedance, free credits
    model: ""                     # empty -> uses BYTEPLUS_VIDEO_MODEL
  fallback:
    provider: openrouter_video    # empty -> uses OPENROUTER_VIDEO_MODEL
    model: ""
defaults:
  duration_s: 5
  aspect_ratio: "16:9"
params:
  camera_motion: "orbit_left"
prompt_suffix: ", smooth dolly orbit around subject, cinematic depth, shallow focus"
allow_override:
  - duration_s
  - aspect_ratio
