id: crash_zoom
label: "Crash Zoom"
category: camera-motion
capability: image_to_video
credit_cost: 12
target:
  primary:
    provider: byteplus            # native Seedance, free credits
    model: ""                     # empty -> uses BYTEPLUS_VIDEO_MODEL
  fallback:
    provider: openrouter_video    # empty -> uses OPENROUTER_VIDEO_MODEL
    model: ""
defaults:
  duration_s: 5
  aspect_ratio: "9:16"
params:
  camera_motion: "zoom_in_fast"
prompt_suffix: ", rapid crash zoom, cinematic, dynamic motion blur"
allow_override:
  - duration_s
  - aspect_ratio
