id: cinematic_still
label: "Cinematic Still"
category: image
capability: text_to_image
credit_cost: 4
target:
  primary:
    provider: openrouter
    model: "google/gemini-2.5-flash-image-preview"
  fallback:
    provider: fal
    model: "fal-ai/flux/dev"
defaults:
  aspect_ratio: "16:9"
  num_images: 1
prompt_suffix: ", cinematic film still, anamorphic, dramatic lighting, color graded, 35mm"
allow_override:
  - aspect_ratio
  - num_images
