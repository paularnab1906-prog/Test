id: establishing_shot
label: "Establishing Shot"
category: camera-motion
capability: text_to_video
credit_cost: 16
target:
  primary:
    provider: byteplus            # native Seedance, free credits
    model: ""                     # empty -> uses BYTEPLUS_VIDEO_MODEL
  fallback:
    provider: openrouter_video    # empty -> uses OPENROUTER_VIDEO_MODEL
    model: ""
defaults:
  duration_s: 5
  aspect_ratio: "16:9"
  resolution: "720p"
params:
  camera_motion: "slow_push_in"
  camerafixed: false
prompt_suffix: ", sweeping cinematic establishing shot, wide angle, slow push in, volumetric light, epic scale"
allow_override:
  - duration_s
  - aspect_ratio
